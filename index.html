<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت روتین روزانه</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glow"></div>
    <div class="glow2"></div>

    <div class="container">
        <header>
            <div class="logo"><img src="assets/Daily-routine-management.svg" alt="Daily routine management"></div>

            <div class="right">
                <div class="date-day">
                    <div class="date">1405 / 02 / 27 </div>
                    <div class="week-day">Sunday</div>
                </div>
                <div class="progress-bar">0%</div>
            </div>
        </header>

        <article class="main-data" style="grid-column: 1/5;">
            <div class="icon">
                <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" width="28" height="28">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                </svg>
            </div>
            <div>
                <div class="data-title">Progress Today</div>
                <div class="data">0% <div class="Progress-main"><div class="Progress-fill"></div></div></div>
            </div>
        </article>
    
        <article class="main-data" style="grid-column: 5/9;">
            <div class="icon">
                <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" width="28" height="28">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>
            <div>
                <div class="data-title">Task Done</div>
                <div class="data">0</div>
            </div>
        </article>

        <article class="main-data" style="grid-column: 9/13;">
            <div class="icon">
                <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" width="28" height="28">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                </svg>
            </div>
            <div>
                <div class="data-title">All Tasks</div>
                <div class="data">0</div>
            </div>
        </article>

        <div class="user-calender" style="grid-column: 1/13; height: auto;">
            <div class="calender-head">
                <img src="assets/Calendar.svg" alt="calender">
                <span>Routine Progress (GitHub Style)</span>
            </div>

            <div class="calendar-wrapper" style="overflow-x: auto; padding-bottom: 10px;">
                <div class="calendar-months" id="calendarMonths"></div>
                <div class="github-calendar" id="githubCalendar">
                    <!-- GitHub style calendar will be generated here -->
                </div>
            </div>

            <div class="calender-info">
                <span>Less</span>
                <div class="calender-day-cart levelCL-0"></div>
                <div class="calender-day-cart levelCL-1"></div>
                <div class="calender-day-cart levelCL-2"></div>
                <div class="calender-day-cart levelCL-3"></div>
                <div class="calender-day-cart levelCL-4"></div>
                <span>More</span>
            </div>
        </div>

        <div class="tasks-container" style="grid-column: 1/9;">
            <!-- قسمت tasks-container-head را پیدا کن (حدود خط 85-95) -->
            <div class="tasks-container-head">
                <select class="task-sort">
                    <option value="all">All</option>
                    <option value="done">Done</option>
                    <option value="not done" selected>Not Done</option>  <!-- اضافه کردن selected -->
                </select>
                <div>
                    <button class="tab active">Routine</button>
                    <button class="tab">Todo List</button>
                    <button class="export-btn" id="exportTasksBtn" style="margin-right: 10px; background: var(--green-600); border: none; padding: 5px 10px; border-radius: 8px; color: white; cursor: pointer;">📥 Export</button>
                </div>
            </div>
            <div class="routin-tasks"></div>

            <div class="tasks-container-foot">
                <button class="add-task" name="add-task"><img src="assets/Plus.svg" alt=""></button>
                <label for="add-task"> Add Task</label>
            </div>
        </div>
        
        <div class="pomodoro" style="grid-column: 9/13;">
            <div class="pomodoro-head">
                <button class="pomodoro-option op-active">Rest</button>
                <button class="pomodoro-option">Work</button>
                <div class="pomodoro-time">00:00</div>
            </div>
            <div class="pomodoro-main">
                <div class="timer">25:00</div>
                <button class="start-btn">START</button>
            </div>
            <div class="pomodoro-foot">
                <button class="add-time" name="add-time"><img src="assets/Plus.svg" alt=""></button>
                <label for="add-Time"> Add Time</label>
            </div>
        </div>

        <!-- book and movie list -->
        
        <div class="movie-list">
            <div class="movie-list-head">
                <h3 class="section-title">add movie for watch</h3>
                <form>
                    <button type="submit" class="add-list-btn"><img src="assets/Plus.svg" alt="add"></button>
                    <input class="add-list-input" type="text" name="movie-name" id="movie-name" placeholder="interstelar">
                </form>
                <button class="export-list-btn" data-type="movies" style="background: var(--green-600); border: none; padding: 5px 10px; border-radius: 8px; color: white; cursor: pointer; margin-top: 10px;">📥 Export Movies</button>
            </div>
            <div class="booklist-task"></div>
        </div>
        
        <div class="book-list">
            <div class="book-list-head">
                <h3 class="section-title">add book for read</h3>
                <form>
                    <button type="submit" class="add-list-btn"><img src="assets/Plus.svg" alt="add"></button>
                    <input class="add-list-input" type="text" name="book-name" id="book-name" placeholder="the little prince">
                </form>
                <button class="export-list-btn" data-type="books" style="background: var(--green-600); border: none; padding: 5px 10px; border-radius: 8px; color: white; cursor: pointer; margin-top: 10px;">📥 Export Books</button>
            </div>
            <div class="booklist-task"></div>
        </div>
    </div>

    <!-- Modal برای افزودن تسک جدید -->
    <div id="taskModal" class="modal-overlay" style="display: none;">
        <div class="modal-container">
            <div class="modal-header">
                <h3>New Task</h3>
                <button class="modal-close" id="closeTaskModal">&times;</button>
            </div>
            <div class="modal-body">
                <label class="modal-label">Task Title</label>
                <input type="text" id="newTaskTitle" class="modal-input" placeholder="Waking Up At 7 Am">
                <div class="modal-buttons">
                    <button id="addTaskConfirm" class="modal-btn modal-btn-primary">Add Task</button>
                    <button id="cancelTaskModal" class="modal-btn modal-btn-secondary">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal برای ویرایش تسک -->
    <div id="editTaskModal" class="modal-overlay" style="display: none;">
        <div class="modal-container">
            <div class="modal-header">
                <h3>Edit Task</h3>
                <button class="modal-close" id="closeEditModal">&times;</button>
            </div>
            <div class="modal-body">
                <label class="modal-label">Task Title</label>
                <input type="text" id="editTaskTitle" class="modal-input" placeholder="Task title">
                <div class="modal-buttons">
                    <button id="editTaskConfirm" class="modal-btn modal-btn-primary">Save Changes</button>
                    <button id="cancelEditModal" class="modal-btn modal-btn-secondary">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal برای افزودن زمان پومودورو -->
    <div id="timeModal" class="modal-overlay" style="display: none;">
        <div class="modal-container">
            <div class="modal-header">
                <h3>Add Time</h3>
                <button class="modal-close" id="closeTimeModal">&times;</button>
            </div>
            <div class="modal-body">
                <label class="modal-label">Minutes to add</label>
                <input type="number" id="addMinutesInput" class="modal-input" placeholder="5" min="1" value="5">
                <div class="modal-buttons">
                    <button id="addTimeConfirm" class="modal-btn modal-btn-primary">Add</button>
                    <button id="cancelTimeModal" class="modal-btn modal-btn-secondary">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal برای انتخاب فرمت Export -->
    <div id="exportModal" class="modal-overlay" style="display: none;">
        <div class="modal-container">
            <div class="modal-header">
                <h3>Export Data</h3>
                <button class="modal-close" id="closeExportModal">&times;</button>
            </div>
            <div class="modal-body">
                <label class="modal-label">Select format</label>
                <div class="modal-buttons">
                    <button id="exportCSV" class="modal-btn modal-btn-primary">CSV</button>
                    <button id="exportJSON" class="modal-btn modal-btn-primary">JSON</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
