<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت روتین روزانه</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glow"></div>
    <div class="glow2"></div>

    <div class="container">
        <header>
            <div class="logo"><img src="assets/Daily-routine-management.svg" alt="Daily routine management"></div>

            <div class="right">
                <div class="date-day">
                    <div class="date">1405 / 02 / 27 </div>
                    <div class="week-day">Sunday</div>
                </div>
                <div class="progress-bar">50%</div>
            </div>
        </header>

        <article class="main-data" style="grid-column: 1/5;">
            <div class="icon">
                <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" width="28" height="28">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                </svg>
            </div>
            <div>
                <div class="data-title">Progress Today</div>
                <div class="data">50% <div class="Progress-main"><div class="Progress-fill"></div></div></div>
            </div>
        </article>
    
        <article class="main-data" style="grid-column: 5/9;">
            <div class="icon">
                <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" width="28" height="28">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>
            <div>
                <div class="data-title">Task Done</div>
                <div class="data">2</div>
            </div>
        </article>

        <article class="main-data" style="grid-column: 9/13;">
            <div class="icon">
                <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" width="28" height="28">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                </svg>
            </div>
            <div>
                <div class="data-title">All Tasks</div>
                <div class="data">4</div>
            </div>
        </article>





        <div class="user-calender">
            <div class="calender-head">
                <img src="assets/Calendar.svg" alt="calender">
                <span>Monthly Calendar</span>
            </div>

            <div class="calender">
                <div class="calender-day-title">SU</div>
                <div class="calender-day-title">MO</div>
                <div class="calender-day-title">TU</div>
                <div class="calender-day-title">WE</div>
                <div class="calender-day-title">TH</div>
                <div class="calender-day-title">FR</div>
                <div class="calender-day-title">SA</div>

                <div class="calender-day-cart level-1"></div>
                <div class="calender-day-cart level-1"></div>
                <div class="calender-day-cart level-1"></div>
                <div class="calender-day-cart level-1"></div>
                <div class="calender-day-cart level-1"></div>
                <div class="calender-day-cart level-1"></div>
                <div class="calender-day-cart level-3"></div>
                <div class="calender-day-cart level-3"></div>
                <div class="calender-day-cart level-3"></div>
                <div class="calender-day-cart level-3"></div>
                <div class="calender-day-cart level-3"></div>
                <div class="calender-day-cart level-3"></div>
                <div class="calender-day-cart level-2"></div>
                <div class="calender-day-cart level-2"></div>
                <div class="calender-day-cart level-2"></div>
                <div class="calender-day-cart level-2"></div>
                <div class="calender-day-cart level-2"></div>
                <div class="calender-day-cart level-2"></div>
                <div class="calender-day-cart level-2"></div>
                <div class="calender-day-cart level-4"></div>
                <div class="calender-day-cart level-4"></div>
                <div class="calender-day-cart level-4"></div>
                <div class="calender-day-cart level-4"></div>
                <div class="calender-day-cart level-4"></div>
                <div class="calender-day-cart level-4"></div>
                <div class="calender-day-cart level-4"></div>
                <div class="calender-day-cart level-4"></div>
                <div class="calender-day-cart level-1"></div>
                <div class="calender-day-cart level-2"></div>
                <div class="calender-day-cart level-3"></div>
            </div>
            <div class="calender-info">
                <div class="calender-day-cart levelCL-1"></div>
                <span>low</span>
                <div class="calender-day-cart levelCL-2"></div>
                <span>medium</span>
                <div class="calender-day-cart levelCL-3"></div>
                <span>good</span>
                <div class="calender-day-cart levelCL-4"></div>
                <span>great</span>
            </div>
        </div>

        <div class="tasks-container">
            <div class="tasks-container-head">
                <select class="task-sort">
                    <option value="all">All</option>
                    <option value="done">Done</option>
                    <option value="not done">Not Done</option>
                </select>
                <div>
                    <button class="tab active">Routine</button>
                    <button class="tab">Todo List</button>
                </div>
            </div>
            <div class="routin-tasks">

                <label class="task">
                    <input type="checkbox" name="routine-task" id="routine-task-1">
                    <span>Waking up at 7 am</span>
                </label>
                
                <label class="task">
                    <input type="checkbox" name="routine-task" id="routine-task-2">
                    <span>Exercise for 30 min</span>
                </label>
                
                <label class="task">
                    <input type="checkbox" name="routine-task" id="routine-task-3">
                    <span>Read a book</span>
                </label>
                <label class="task">
                    <input type="checkbox" name="routine-task" id="routine-task-1">
                    <span>Waking up at 7 am</span>
                </label>
                <label class="task">
                    <input type="checkbox" name="routine-task" id="routine-task-1">
                    <span>Waking up at 7 am</span>
                </label>

                <label class="task">
                    <input type="checkbox" name="routine-task" id="routine-task-2">
                    <span>Exercise for 30 min</span>
                </label>

                <label class="task">
                    <input type="checkbox" name="routine-task" id="routine-task-3">
                    <span>Read a book</span>
                </label>
                <label class="task">
                    <input type="checkbox" name="routine-task" id="routine-task-1">
                    <span>Waking up at 7 am</span>
                </label>

            </div>

            <div class="tasks-container-foot">
                <button class="add-task" name="add-task"><img src="assets/Plus.svg" alt=""></button>
                <label for="add-task"> Add Task</label>
            </div>
        </div>
        <div class="pomodoro">
            <div class="pomodoro-head">
                <button class="pomodoro-option op-active">Rest</button>
                <button class="pomodoro-option">Work</button>
                <div class="pomodoro-time">11:58</div>
            </div>
            <div class="pomodoro-main">
                <div class="timer">25:00</div>
                <button class="start-btn">START</button>
            </div>
            <div class="pomodoro-foot">
                <button class="add-time" name="add-time"><img src="assets/Plus.svg" alt=""></button>
                <label for="add-Time"> Add Time</label>
            </div>
        </div>

        <!-- book and movie list -->
        
        <div class="movie-list">
            <div class="movie-list-head">
                <h3 class="section-title">add movie for watch</h3>
                <form >
                    <button type="submit" class="add-list-btn"><img src="assets/Plus.svg" alt="add"></button>
                    <input class="add-list-input" type="text" name="movie-name" id="movie-name" placeholder="interstelar">
                </form>
            </div>
            <div class="booklist-task"></div>
        </div>
        
        <div class="book-list">
            <div class="book-list-head">
                <h3 class="section-title">add book for read</h3>
                <form >
                    <button type="submit" class="add-list-btn"><img src="assets/Plus.svg" alt="add"></button>
                    <input class="add-list-input" type="text" name="book-name" id="book-name" placeholder="the little prence">
                </form>
                <!-- movie list -->
            </div>
            <div class="booklist-task"></div>
        </div>
        <!-- پایان body -->
    </div>

    <!-- Modal برای افزودن تسک جدید -->
<div id="taskModal" class="modal-overlay" style="display: none;">
    <div class="modal-container">
        <div class="modal-header">
            <h3>New Task</h3>
            <button class="modal-close" id="closeTaskModal">&times;</button>
        </div>
        <div class="modal-body">
            <label class="modal-label">Task Title</label>
            <input type="text" id="newTaskTitle" class="modal-input" placeholder="Waking Up At 7 Am">
            <div class="modal-buttons">
                <button id="addTaskConfirm" class="modal-btn modal-btn-primary">Add Task</button>
                <button id="cancelTaskModal" class="modal-btn modal-btn-secondary">Cancel</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal برای افزودن زمان پومودورو -->
<div id="timeModal" class="modal-overlay" style="display: none;">
    <div class="modal-container">
        <div class="modal-header">
            <h3>Add Time</h3>
            <button class="modal-close" id="closeTimeModal">&times;</button>
        </div>
        <div class="modal-body">
            <label class="modal-label">Minutes to add</label>
            <input type="number" id="addMinutesInput" class="modal-input" placeholder="5" min="1" value="5">
            <div class="modal-buttons">
                <button id="addTimeConfirm" class="modal-btn modal-btn-primary">Add</button>
                <button id="cancelTimeModal" class="modal-btn modal-btn-secondary">Cancel</button>
            </div>
        </div>
    </div>
</div>


    <script src="script.js"></script>
</body>
</html>
